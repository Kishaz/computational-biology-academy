project:
  type: website
  output-dir: _site

website:
  title: "Bioinformatics for Molecular Biology"
  description: "Beginner-friendly, step-by-step tutorials for bioinformatics analysis of molecular data."
  repo-url: https://github.com/Kishaz/bioinformatics-tutorials
  repo-actions: [issue, source]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: "Modules"
        menu:
          - href: modules/01-setup-environment/index.qmd
            text: "01 · Environment Setup"
          - href: modules/02-r-for-biologists/index.qmd
            text: "02 · R for Biologists"
          - href: modules/03-molecular-data-types/index.qmd
            text: "03 · Molecular Data Types"
          - href: modules/04-command-line-essentials/index.qmd
            text: "04 · Command-Line Essentials"
          - href: modules/05-reads-and-quality-control/index.qmd
            text: "05 · Reads & Quality Control"
    right:
      - text: "by Samuel Mwamburi, PhD"
        href: https://samuel-mwamburi.netlify.app/
  sidebar:
    style: docked
    search: true
    contents:
      - section: "Getting Started"
        contents:
          - href: index.qmd
            text: "Welcome"
      - section: "Modules"
        contents:
          - href: modules/01-setup-environment/index.qmd
            text: "01 · Environment Setup (Windows/WSL + macOS + Conda)"
          - href: modules/02-r-for-biologists/index.qmd
            text: "02 · An Introduction to R for Biologists"
          - href: modules/03-molecular-data-types/index.qmd
            text: "03 · A Field Guide to Molecular Data Types"
          - href: modules/04-command-line-essentials/index.qmd
            text: "04 · The Command Line — Essential Commands"
          - href: modules/05-reads-and-quality-control/index.qmd
            text: "05 · Reads & Quality Control"
  page-footer:
    left: "© 2026 Samuel Mwamburi, PhD · CC BY 4.0"
    center: "Educational material. Verify all tool commands against current official documentation before use."

# Site-wide author metadata — gives every page a byline under its title.
author:
  - name: "Samuel Mwamburi, PhD"
    url: https://samuel-mwamburi.netlify.app/
    orcid: 0000-0003-4253-3967

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    css: styles.css

# NOTE: Version numbers of Quarto, R, Python and every bioinformatics tool
# referenced in these tutorials change over time. Treat all version strings
# as examples and pin/verify against current official docs.
