<circle cx="122" cy="106" r="5" fill="#d9862f" opacity="0.9"/>
<circle cx="131" cy="143" r="5" fill="#2e9c6d" opacity="0.9"/>
<circle cx="85" cy="104" r="5" fill="#3f7fd0" opacity="0.9"/>
<circle cx="142" cy="135" r="5" fill="#d9862f" opacity="0.9"/>
<circle cx="127" cy="164" r="5" fill="#2e9c6d" opacity="0.9"/>
<circle cx="126" cy="166" r="5" fill="#3f7fd0" opacity="0.9"/>
<circle cx="94" cy="158" r="5" fill="#d9862f" opacity="0.9"/>
<circle cx="99" cy="167" r="5" fill="#2e9c6d" opacity="0.9"/>
<circle cx="143" cy="109" r="5" fill="#3f7fd0" opacity="0.9"/>
<circle cx="69" cy="117" r="5" fill="#d9862f" opacity="0.9"/>
<circle cx="152" cy="133" r="5" fill="#2e9c6d" opacity="0.9"/>
<line x1="180" y1="115" x2="300" y2="95" stroke="#9aa6b3" stroke-width="2"/>
<path d="M300 95 l-11 -1 l4 10 z" fill="#9aa6b3"/>
<text x="240" y="80" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b6675">BULK: blend all cells</text>
<text x="360" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#28303a">one averaged profile</text>
<rect x="320" y="122" width="10" height="28" rx="2" fill="#9aa6b3"/>
<rect x="334" y="119" width="10" height="31" rx="2" fill="#9aa6b3"/>
<rect x="348" y="123" width="10" height="27" rx="2" fill="#9aa6b3"/>
<rect x="362" y="121" width="10" height="29" rx="2" fill="#9aa6b3"/>
<rect x="376" y="122" width="10" height="28" rx="2" fill="#9aa6b3"/>
<rect x="390" y="121" width="10" height="29" rx="2" fill="#9aa6b3"/>
<text x="360" y="172" text-anchor="middle" font-size="10.5" fill="#c0392b">which cell types? hidden</text>
<line x1="180" y1="160" x2="300" y2="250" stroke="#9aa6b3" stroke-width="2"/>
<path d="M300 250 l-10 -5 l-1 11 z" fill="#9aa6b3"/>
<text x="240" y="225" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b6675">SINGLE-CELL: one at a time</text>
<text x="560" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#28303a">a profile for every cell, so the types separate</text>
<text x="357" y="345" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3f7fd0">type 1</text>
