<rect x="540" y="313" width="10" height="7" rx="2" fill="#d9862f"/>
<text x="637" y="345" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2e9c6d">type 3</text>
<rect x="610" y="316" width="10" height="4" rx="2" fill="#2e9c6d"/>
<rect x="624" y="313" width="10" height="7" rx="2" fill="#2e9c6d"/>
<rect x="638" y="316" width="10" height="4" rx="2" fill="#2e9c6d"/>
<rect x="652" y="300" width="10" height="20" rx="2" fill="#2e9c6d"/>
<rect x="666" y="313" width="10" height="7" rx="2" fill="#2e9c6d"/>
<rect x="680" y="316" width="10" height="4" rx="2" fill="#2e9c6d"/>
<text x="34" y="404" font-size="11.5" fill="#5b6675">The bulk average looks like no real cell. Measuring cells one by one keeps each cell type&#39;s distinct pattern intact.</text>
</svg>
