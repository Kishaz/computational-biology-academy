<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="A mixed tissue of three cell types. Bulk RNA-seq blends them into one averaged profile that matches no single type. Single-cell RNA-seq measures each cell separately, so the three cell types stay visible.">
<rect x="0.5" y="0.5" width="819" height="419" rx="14" fill="#ffffff" stroke="#dde3ea"/>
<text x="34" y="42" font-size="17" font-weight="800" fill="#28303a">Bulk hides the crowd; single-cell sees each cell</text>
<text x="105" y="205" text-anchor="middle" font-size="12.5" font-weight="700" fill="#28303a">a tissue</text>
<text x="105" y="221" text-anchor="middle" font-size="10.5" fill="#5b6675">(mixed cells)</text>
<rect x="40" y="90" width="130" height="95" rx="10" fill="#f7f9fb" stroke="#c4ccd4"/>
<circle cx="79" cy="140" r="5" fill="#3f7fd0" opacity="0.9"/>
<circle cx="92" cy="144" r="5" fill="#d9862f" opacity="0.9"/>
