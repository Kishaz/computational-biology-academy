<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="A dot plot: three clusters by three marker genes. Cluster 0 strongly expresses markerA, cluster 1 markerB, cluster 2 markerC. Each cluster is therefore named as the matching cell type.">
<rect x="0.5" y="0.5" width="719" height="329" rx="14" fill="#ffffff" stroke="#dde3ea"/>
<text x="34" y="40" font-size="17" font-weight="800" fill="#28303a">Naming the clusters: each is marked by a gene</text>
<text x="34" y="60" font-size="12" fill="#5b6675">Bigger, darker dot = the gene is more active in that cluster.</text>
<text x="200" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#28303a" font-family="ui-monospace, Menlo, monospace">markerA</text>
<text x="310" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#28303a" font-family="ui-monospace, Menlo, monospace">markerB</text>
<text x="420" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#28303a" font-family="ui-monospace, Menlo, monospace">markerC</text>
<text x="130" y="124" text-anchor="end" font-size="12.5" font-weight="700" fill="#5b6675" font-family="ui-monospace, Menlo, monospace">cluster 0</text>
<circle cx="200" cy="120" r="17.7" fill="rgb(19,110,98)"/>
<circle cx="310" cy="120" r="6.3" fill="rgb(211,232,229)"/>
<circle cx="420" cy="120" r="5.6" fill="rgb(224,240,238)"/>
<text x="490" y="124" font-size="12" font-weight="800" fill="#2e8b57">&#8594; cell type A</text>
<text x="130" y="188" text-anchor="end" font-size="12.5" font-weight="700" fill="#5b6675" font-family="ui-monospace, Menlo, monospace">cluster 1</text>
<circle cx="200" cy="184" r="8.1" fill="rgb(180,213,208)"/>
<circle cx="310" cy="184" r="17.6" fill="rgb(20,111,98)"/>
<circle cx="420" cy="184" r="5.7" fill="rgb(220,238,235)"/>
<text x="490" y="188" font-size="12" font-weight="800" fill="#2e8b57">&#8594; cell type B</text>
<text x="130" y="252" text-anchor="end" font-size="12.5" font-weight="700" fill="#5b6675" font-family="ui-monospace, Menlo, monospace">cluster 2</text>
<circle cx="200" cy="248" r="8.1" fill="rgb(181,213,208)"/>
<circle cx="310" cy="248" r="6.6" fill="rgb(206,229,225)"/>
<circle cx="420" cy="248" r="17.6" fill="rgb(21,111,99)"/>
<text x="490" y="252" font-size="12" font-weight="800" fill="#2e8b57">&#8594; cell type C</text>
<text x="34" y="310" font-size="11.5" fill="#5b6675">A cluster is only a number until a known marker gene tells you which cell type it is. That step is annotation.</text>
</svg>
