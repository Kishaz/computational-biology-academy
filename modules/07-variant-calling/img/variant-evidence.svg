<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A stack of reads aligned under a reference sequence. In one column every read disagrees with the reference the same way, which is a true variant. In another column a single read disagrees, which is just a sequencing error. Depth and agreement tell them apart.">
  <rect x="1" y="1" width="818" height="338" rx="10" fill="#ffffff" stroke="#d5dbe2"/>

  <text x="24" y="34" font-size="14" font-weight="700" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#2b3138">Signal versus noise: what makes a real variant</text>

  <!-- reference row -->
  <text x="24" y="70" font-size="13" font-weight="700" fill="#6b1fb0">ref</text>
  <g font-size="16" text-anchor="middle" fill="#5b6675">
    <text x="120" y="72">T</text><text x="160" y="72">C</text>
    <text x="200" y="72" font-weight="700" fill="#6b1fb0">A</text>
    <text x="240" y="72">G</text><text x="280" y="72">T</text><text x="320" y="72">C</text>
    <text x="360" y="72" font-weight="700" fill="#6b1fb0">C</text>
    <text x="400" y="72">A</text><text x="440" y="72">T</text><text x="480" y="72">G</text>
    <text x="520" y="72">C</text><text x="560" y="72">A</text>
  </g>

  <!-- highlight the two columns of interest -->
  <rect x="186" y="80" width="28" height="210" rx="4" fill="#2e9e5b" opacity="0.08"/>
  <rect x="346" y="80" width="28" height="210" rx="4" fill="#e15d5d" opacity="0.08"/>

  <!-- reads: 8 rows. col at x=200 is the TRUE variant (all G), col at x=360 is NOISE (one T) -->
  <g font-size="16" text-anchor="middle">
    <!-- helper: matching bases in grey, variant G in green, error T in red -->
    <!-- row 1 -->
    <g fill="#9aa2ad"><text x="120" y="104">T</text><text x="160" y="104">C</text><text x="200" y="104" fill="#2e9e5b" font-weight="700">G</text><text x="240" y="104">G</text><text x="280" y="104">T</text><text x="320" y="104">C</text><text x="360" y="104">C</text><text x="400" y="104">A</text><text x="440" y="104">T</text></g>
    <!-- row 2 -->
    <g fill="#9aa2ad"><text x="160" y="126">C</text><text x="200" y="126" fill="#2e9e5b" font-weight="700">G</text><text x="240" y="126">G</text><text x="280" y="126">T</text><text x="320" y="126">C</text><text x="360" y="126">C</text><text x="400" y="126">A</text><text x="440" y="126">T</text><text x="480" y="126">G</text></g>
    <!-- row 3 (this read has the sequencing error at x=360) -->
    <g fill="#9aa2ad"><text x="120" y="148">T</text><text x="160" y="148">C</text><text x="200" y="148" fill="#2e9e5b" font-weight="700">G</text><text x="240" y="148">G</text><text x="280" y="148">T</text><text x="320" y="148">C</text><text x="360" y="148" fill="#e15d5d" font-weight="700">T</text><text x="400" y="148">A</text><text x="440" y="148">T</text></g>
    <!-- row 4 -->
    <g fill="#9aa2ad"><text x="200" y="170" fill="#2e9e5b" font-weight="700">G</text><text x="240" y="170">G</text><text x="280" y="170">T</text><text x="320" y="170">C</text><text x="360" y="170">C</text><text x="400" y="170">A</text><text x="440" y="170">T</text><text x="480" y="170">G</text><text x="520" y="170">C</text></g>
    <!-- row 5 -->
    <g fill="#9aa2ad"><text x="120" y="192">T</text><text x="160" y="192">C</text><text x="200" y="192" fill="#2e9e5b" font-weight="700">G</text><text x="240" y="192">G</text><text x="280" y="192">T</text><text x="320" y="192">C</text><text x="360" y="192">C</text><text x="400" y="192">A</text><text x="440" y="192">T</text></g>
    <!-- row 6 -->
    <g fill="#9aa2ad"><text x="160" y="214">C</text><text x="200" y="214" fill="#2e9e5b" font-weight="700">G</text><text x="240" y="214">G</text><text x="280" y="214">T</text><text x="320" y="214">C</text><text x="360" y="214">C</text><text x="400" y="214">A</text><text x="440" y="214">T</text><text x="480" y="214">G</text></g>
    <!-- row 7 -->
    <g fill="#9aa2ad"><text x="200" y="236" fill="#2e9e5b" font-weight="700">G</text><text x="240" y="236">G</text><text x="280" y="236">T</text><text x="320" y="236">C</text><text x="360" y="236">C</text><text x="400" y="236">A</text><text x="440" y="236">T</text><text x="480" y="236">G</text><text x="520" y="236">C</text></g>
    <!-- row 8 -->
    <g fill="#9aa2ad"><text x="120" y="258">T</text><text x="160" y="258">C</text><text x="200" y="258" fill="#2e9e5b" font-weight="700">G</text><text x="240" y="258">G</text><text x="280" y="258">T</text><text x="320" y="258">C</text><text x="360" y="258">C</text><text x="400" y="258">A</text><text x="440" y="258">T</text></g>
  </g>

  <!-- brackets/labels -->
  <g font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="200" y="308" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2e9e5b">true variant</text>
    <text x="200" y="324" text-anchor="middle" font-size="10.5" fill="#5b6675">every read: A&#8594;G</text>
    <text x="360" y="308" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e15d5d">sequencing error</text>
    <text x="360" y="324" text-anchor="middle" font-size="10.5" fill="#5b6675">one lonely read</text>
  </g>
</svg>
