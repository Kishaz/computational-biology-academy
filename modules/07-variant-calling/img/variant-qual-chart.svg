<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Bar chart of the quality score for five called variants. Four real variants score about 225. One sequencing-error call scores 17, far below a quality threshold of 20, so a simple filter removes it and keeps the four real ones.">
  <rect x="1" y="1" width="818" height="298" rx="10" fill="#ffffff" stroke="#d5dbe2"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#2b3138">Quality score sorts the real from the noise</text>

  <!-- axis origin at x=150, bars scaled so QUAL 228 -> width 560 (1 QUAL ~= 2.456px) -->
  <!-- 241 -->
  <text x="24" y="72" font-size="12" font-weight="700" fill="#2b3138">241 C&#8594;T</text>
  <rect x="150" y="58" width="553" height="20" rx="3" fill="#2e9e5b"/>
  <text x="711" y="73" font-size="11.5" font-weight="700" fill="#2b3138">225</text>
  <!-- 3037 -->
  <text x="24" y="104" font-size="12" font-weight="700" fill="#2b3138">3037 C&#8594;T</text>
  <rect x="150" y="90" width="553" height="20" rx="3" fill="#2e9e5b"/>
  <text x="711" y="105" font-size="11.5" font-weight="700" fill="#2b3138">225</text>
  <!-- 14408 -->
  <text x="24" y="136" font-size="12" font-weight="700" fill="#2b3138">14408 C&#8594;T</text>
  <rect x="150" y="122" width="553" height="20" rx="3" fill="#2e9e5b"/>
  <text x="711" y="137" font-size="11.5" font-weight="700" fill="#2b3138">225</text>
  <!-- 23403 D614G -->
  <text x="24" y="168" font-size="12" font-weight="700" fill="#2b3138">23403 A&#8594;G</text>
  <rect x="150" y="154" width="561" height="20" rx="3" fill="#2e9e5b"/>
  <text x="719" y="169" font-size="11.5" font-weight="700" fill="#2b3138">228</text>
  <text x="164" y="168" font-size="10.5" font-weight="700" fill="#ffffff">D614G</text>
  <!-- 29891 noise -->
  <text x="24" y="200" font-size="12" font-weight="700" fill="#2b3138">29891 A&#8594;G</text>
  <rect x="150" y="186" width="42" height="20" rx="3" fill="#e15d5d"/>
  <text x="200" y="201" font-size="11.5" font-weight="700" fill="#e15d5d">17</text>

  <!-- threshold line at QUAL 20 -> x = 150 + 20*2.456 = ~199 -->
  <line x1="199" y1="50" x2="199" y2="222" stroke="#c23b3b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="205" y="240" font-size="11" fill="#c23b3b">filter: keep QUAL &#8805; 20</text>

  <text x="24" y="272" font-size="11.5" fill="#5b6675">The four planted mutations score around 225. The lone sequencing error scores 17 and falls to the left of the line.</text>
  <text x="24" y="288" font-size="11.5" fill="#5b6675">One threshold, and the noise is gone.</text>
</svg>
