<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Three-panel stick-figure comic. Prof. Zola asks how five samples, and five hundred more coming, are all related. Amina realises samples that share the same mutations share an ancestor, so the pattern is a family tree. She aligns them and a tree with two clades draws itself.">
  <rect x="1" y="1" width="998" height="298" rx="10" fill="#ffffff" stroke="#d5dbe2"/>

  <line x1="334" y1="16" x2="334" y2="284" stroke="#e2e6ea"/>
  <line x1="667" y1="16" x2="667" y2="284" stroke="#e2e6ea"/>

  <!-- Panel 1: Prof. Zola -->
  <g stroke="#2b3138" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="80" cy="150" r="20" fill="#f3e8fd"/>
    <line x1="80" y1="170" x2="80" y2="222"/>
    <line x1="80" y1="185" x2="54" y2="208"/>
    <line x1="80" y1="185" x2="112" y2="200"/>
    <line x1="80" y1="222" x2="62" y2="256"/>
    <line x1="80" y1="222" x2="98" y2="256"/>
  </g>
  <rect x="104" y="188" width="26" height="18" rx="3" fill="#dfe4ea" stroke="#2b3138" stroke-width="2"/>
  <text x="80" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#6b1fb0">Prof. Zola</text>
  <g>
    <rect x="150" y="42" width="176" height="74" rx="12" fill="#f7f9fb" stroke="#b9c2cc"/>
    <path d="M150 98 l-16 14 l24 -4 z" fill="#f7f9fb" stroke="#b9c2cc"/>
    <text x="164" y="66" font-size="12.5" fill="#2b3138">Five samples, and five</text>
    <text x="164" y="86" font-size="12.5" fill="#2b3138">hundred more coming.</text>
    <text x="164" y="106" font-size="12.5" fill="#2b3138">How are they related?</text>
  </g>

  <!-- Panel 2: Amina idea -->
  <g stroke="#2b3138" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="415" cy="150" r="20" fill="#e8f0fe"/>
    <line x1="415" y1="170" x2="415" y2="222"/>
    <line x1="415" y1="185" x2="389" y2="205"/>
    <line x1="415" y1="185" x2="441" y2="205"/>
    <line x1="415" y1="222" x2="397" y2="256"/>
    <line x1="415" y1="222" x2="433" y2="256"/>
  </g>
  <text x="415" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#1a56b0">Amina</text>
  <g>
    <rect x="470" y="42" width="192" height="74" rx="12" fill="#eef5ff" stroke="#9cc0f5"/>
    <circle cx="466" cy="128" r="4" fill="#9cc0f5"/><circle cx="458" cy="140" r="3" fill="#9cc0f5"/>
    <text x="484" y="64" font-size="12.5" fill="#2b3138">Share the same</text>
    <text x="484" y="84" font-size="12.5" fill="#2b3138">mutations, share an</text>
    <text x="484" y="104" font-size="12.5" fill="#2b3138">ancestor. It is a tree.</text>
  </g>

  <!-- Panel 3: Amina with a little tree -->
  <g stroke="#2b3138" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="720" cy="150" r="20" fill="#e8f0fe"/>
    <line x1="720" y1="170" x2="720" y2="222"/>
    <line x1="720" y1="185" x2="694" y2="205"/>
    <line x1="720" y1="185" x2="746" y2="205"/>
    <line x1="720" y1="222" x2="702" y2="256"/>
    <line x1="720" y1="222" x2="738" y2="256"/>
  </g>
  <!-- little tree motif -->
  <g stroke="#2e9e5b" stroke-width="2.5" fill="none">
    <path d="M812 150 L836 150 L836 128 L868 128"/>
    <path d="M836 150 L836 172 L868 172"/>
    <path d="M868 128 L868 118 L896 118 M868 128 L868 138 L896 138"/>
    <path d="M868 172 L868 162 L896 162 M868 172 L868 182 L896 182"/>
  </g>
  <text x="720" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#1a56b0">Amina</text>
  <g>
    <rect x="800" y="40" width="180" height="52" rx="12" fill="#e6f4ea" stroke="#8bd4a6"/>
    <path d="M838 84 l-6 16 l18 -10 z" fill="#e6f4ea" stroke="#8bd4a6"/>
    <text x="814" y="64" font-size="12.5" fill="#2b3138">Two clades, exactly</text>
    <text x="814" y="84" font-size="12.5" fill="#2b3138">as expected.</text>
  </g>
</svg>
