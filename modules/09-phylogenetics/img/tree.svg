<svg viewBox="0 0 860 450" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="A rooted phylogenetic tree of six SARS-CoV-2-like genomes. Reference and early branch near the root. Alpha1 and alpha2 form a clade defined by N501Y, bootstrap 76. Delta1 and delta2 form a clade defined by L452R, bootstrap 75. Both clades share a deep branch defined by the D614G set, bootstrap 99. Nested shaded boxes show the nested ancestry.">
<rect x="0.5" y="0.5" width="859" height="449" rx="14" fill="#ffffff" stroke="#dde3ea"/>
<text x="36" y="48" font-size="18" font-weight="800" fill="#28303a">The family tree the data drew</text>
<text x="36" y="71" font-size="12.5" fill="#5b6675">Shared mutations mark shared branches. Nested boxes are nested clades.</text>
<rect x="298" y="186" width="488" height="226" rx="14" fill="#f3eefb" stroke="#e2d7f6"/>
<rect x="448" y="200" width="316" height="86" rx="14" fill="#eaf3fd" stroke="#d2e2f8"/>
<rect x="448" y="312" width="316" height="86" rx="14" fill="#fdf3e6" stroke="#f5dfc4"/>
<text x="310" y="203" font-size="10.5" font-weight="800" fill="#7c5cbf" letter-spacing="0.6">D614G CLADE</text>
<line x1="112" y1="198" x2="150" y2="198" stroke="#c7d0da" stroke-width="2.6" stroke-linecap="round"/>
<line x1="150" y1="98" x2="150" y2="299" stroke="#c7d0da" stroke-width="2.6" stroke-linecap="round"/>
<line x1="150" y1="98" x2="620" y2="98" stroke="#9aa6b3" stroke-width="2.6" stroke-linecap="round"/>
<line x1="150" y1="144" x2="620" y2="144" stroke="#9aa6b3" stroke-width="2.6" stroke-linecap="round"/>
<line x1="150" y1="299" x2="300" y2="299" stroke="#7c5cbf" stroke-width="4.4" stroke-linecap="round"/>
<line x1="300" y1="243" x2="300" y2="355" stroke="#c7d0da" stroke-width="2.6" stroke-linecap="round"/>
<line x1="300" y1="243" x2="470" y2="243" stroke="#3f7fd0" stroke-width="4.4" stroke-linecap="round"/>
<line x1="470" y1="222" x2="470" y2="264" stroke="#c7d0da" stroke-width="2.6" stroke-linecap="round"/>
<line x1="470" y1="222" x2="620" y2="222" stroke="#3f7fd0" stroke-width="3" stroke-linecap="round"/>
<line x1="470" y1="264" x2="620" y2="264" stroke="#3f7fd0" stroke-width="3" stroke-linecap="round"/>
<line x1="300" y1="355" x2="470" y2="355" stroke="#d9862f" stroke-width="4.4" stroke-linecap="round"/>
<line x1="470" y1="334" x2="470" y2="376" stroke="#c7d0da" stroke-width="2.6" stroke-linecap="round"/>
<line x1="470" y1="334" x2="620" y2="334" stroke="#d9862f" stroke-width="3" stroke-linecap="round"/>
<line x1="470" y1="376" x2="620" y2="376" stroke="#d9862f" stroke-width="3" stroke-linecap="round"/>
<circle cx="300" cy="299" r="4.5" fill="#7c5cbf"/>
<circle cx="470" cy="243" r="4.5" fill="#3f7fd0"/>
<circle cx="470" cy="355" r="4.5" fill="#d9862f"/>
<circle cx="112" cy="198" r="4" fill="#28303a"/>
<text x="104" y="202" text-anchor="end" font-size="10.5" fill="#5b6675">root</text>
<circle cx="620" cy="98" r="5.5" fill="#9aa6b3"/>
<text x="636" y="102" font-size="13.5" font-weight="700" fill="#28303a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">reference</text>
<text x="734" y="102" font-size="10.5" fill="#5b6675">ancestor</text>
<circle cx="620" cy="144" r="5.5" fill="#9aa6b3"/>
<text x="636" y="148" font-size="13.5" font-weight="700" fill="#28303a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">early</text>
<circle cx="620" cy="222" r="5.5" fill="#3f7fd0"/>
<text x="636" y="226" font-size="13.5" font-weight="700" fill="#28303a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">alpha1</text>
<circle cx="620" cy="264" r="5.5" fill="#3f7fd0"/>
<text x="636" y="268" font-size="13.5" font-weight="700" fill="#28303a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">alpha2</text>
<circle cx="620" cy="334" r="5.5" fill="#d9862f"/>
<text x="636" y="338" font-size="13.5" font-weight="700" fill="#28303a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">delta1</text>
<circle cx="620" cy="376" r="5.5" fill="#d9862f"/>
<text x="636" y="380" font-size="13.5" font-weight="700" fill="#28303a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">delta2</text>
<text x="225" y="286" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c5cbf">D614G + 3 shared</text>
<text x="385" y="231" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3f7fd0">N501Y</text>
<text x="385" y="375" text-anchor="middle" font-size="11.5" font-weight="700" fill="#d9862f">L452R</text>
<rect x="284" y="288" width="32" height="22" rx="11" fill="#ffffff" stroke="#7c5cbf" stroke-width="1.6"/>
<text x="300" y="303" text-anchor="middle" font-size="11.5" font-weight="800" fill="#7c5cbf">99</text>
<rect x="454" y="232" width="32" height="22" rx="11" fill="#ffffff" stroke="#3f7fd0" stroke-width="1.6"/>
<text x="470" y="247" text-anchor="middle" font-size="11.5" font-weight="800" fill="#3f7fd0">76</text>
<rect x="454" y="344" width="32" height="22" rx="11" fill="#ffffff" stroke="#d9862f" stroke-width="1.6"/>
<text x="470" y="359" text-anchor="middle" font-size="11.5" font-weight="800" fill="#d9862f">75</text>
<line x1="36" y1="396" x2="824" y2="396" stroke="#eef1f4"/>
<text x="36" y="417" font-size="11.5" fill="#5b6675">The circled numbers are <tspan font-weight="700" fill="#28303a">bootstrap support</tspan> (out of 100): how often each split reappears when the data are resampled.</text>
<text x="36" y="435" font-size="11.5" fill="#5b6675">The deep split rests on four shared mutations, so it scores 99. Each single-mutation clade scores in the seventies. More evidence, more confidence.</text>
</svg>
