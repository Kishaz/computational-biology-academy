<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Three genes on a stretch of genome. Reads pile up over each gene. A highly expressed gene has a tall pile and a large count, a moderate gene a medium pile, a low gene a short pile. Expression is the number of reads counted in each gene.">
<rect x="0.5" y="0.5" width="819" height="379" rx="14" fill="#ffffff" stroke="#dde3ea"/>
<text x="34" y="44" font-size="17" font-weight="800" fill="#28303a">Expression is just counting</text>
<text x="34" y="66" font-size="12.5" fill="#5b6675">A gene with more RNA sheds more reads. Count the reads landing in each gene, and you have measured how active it is.</text>
<rect x="145" y="250" width="90" height="7" rx="3" fill="#3f8fd6" opacity="0.85"/>
