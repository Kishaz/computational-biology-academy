<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The central dogma with splicing. A gene in DNA has three coloured exons separated by grey introns. It is transcribed into pre-mRNA with the same exons and introns. Splicing removes the introns and joins the exons into a mature mRNA. The mature mRNA is translated into protein.">
<rect x="0.5" y="0.5" width="819" height="469" rx="14" fill="#ffffff" stroke="#dde3ea"/>
<text x="34" y="42" font-size="17" font-weight="800" fill="#28303a">From gene to protein: splicing edits the message</text>
<text x="34" y="96" font-size="12.5" font-weight="700" fill="#28303a">DNA</text>
<rect x="146" y="88" width="24" height="6" fill="#c3ccd6"/>
<rect x="170" y="78" width="90" height="26" rx="5" fill="#3f7fd0"/><text x="215" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">exon 1</text>
<rect x="260" y="88" width="54" height="6" fill="#c3ccd6"/>
<rect x="314" y="78" width="120" height="26" rx="5" fill="#7c5cbf"/><text x="374" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">exon 2</text>
<rect x="434" y="88" width="54" height="6" fill="#c3ccd6"/>
<rect x="488" y="78" width="80" height="26" rx="5" fill="#1f9c8f"/><text x="528" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">exon 3</text>
<rect x="568" y="88" width="24" height="6" fill="#c3ccd6"/>
<text x="287" y="74" text-anchor="middle" font-size="9.5" fill="#5b6675">intron</text>
<line x1="369" y1="108" x2="369" y2="139" stroke="#9aa6b3" stroke-width="2.4"/>
<path d="M 369 148 l -6 -11 l 12 0 z" fill="#9aa6b3"/>
<text x="383" y="132" font-size="12" font-style="italic" fill="#5b6675">transcription</text>
<text x="34" y="168" font-size="12.5" font-weight="700" fill="#28303a">pre-mRNA</text>
<text x="34" y="182" font-size="9.5" fill="#5b6675">still has introns</text>
<rect x="170" y="150" width="90" height="26" rx="5" fill="#3f7fd0"/><text x="215" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">exon 1</text>
<rect x="260" y="160" width="54" height="6" fill="#c3ccd6"/>
<rect x="314" y="150" width="120" height="26" rx="5" fill="#7c5cbf"/><text x="374" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">exon 2</text>
<rect x="434" y="160" width="54" height="6" fill="#c3ccd6"/>
<rect x="488" y="150" width="80" height="26" rx="5" fill="#1f9c8f"/><text x="528" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">exon 3</text>
<path d="M 260 163 q 27 -30 54 0" fill="none" stroke="#d98a34" stroke-width="2" stroke-dasharray="3 3"/>
<path d="M 434 163 q 27 -30 54 0" fill="none" stroke="#d98a34" stroke-width="2" stroke-dasharray="3 3"/>
<line x1="369" y1="180" x2="369" y2="227" stroke="#9aa6b3" stroke-width="2.4"/>
<path d="M 369 236 l -6 -11 l 12 0 z" fill="#9aa6b3"/>
<text x="383" y="212" font-size="12" font-style="italic" fill="#5b6675">splicing: introns removed, exons joined</text>
<text x="34" y="256" font-size="12.5" font-weight="700" fill="#28303a">mature mRNA</text>
<text x="34" y="270" font-size="9.5" fill="#5b6675">introns gone</text>
<rect x="224" y="238" width="90" height="26" rx="5" fill="#3f7fd0"/><text x="269" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">exon 1</text>
<rect x="314" y="238" width="120" height="26" rx="5" fill="#7c5cbf"/><text x="374" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">exon 2</text>
<rect x="434" y="238" width="80" height="26" rx="5" fill="#1f9c8f"/><text x="474" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">exon 3</text>
<line x1="369" y1="268" x2="369" y2="315" stroke="#9aa6b3" stroke-width="2.4"/>
<path d="M 369 324 l -6 -11 l 12 0 z" fill="#9aa6b3"/>
<text x="383" y="300" font-size="12" font-style="italic" fill="#5b6675">translation</text>
<text x="34" y="348" font-size="12.5" font-weight="700" fill="#28303a">protein</text>
<polyline points="210,336 236,352 262,336 288,352 314,336 340,352 366,336 392,352 418,336 444,352 470,336" fill="none" stroke="#2e8b57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="210" cy="336" r="6" fill="#2e8b57"/>
<text x="34" y="448" font-size="11.5" fill="#5b6675">A gene is not read straight through. The cell copies it, snips out the <tspan fill="#5b6675" font-weight="700">introns</tspan>, and joins the <tspan fill="#28303a" font-weight="700">exons</tspan> into the message it actually translates.</text>
</svg>
