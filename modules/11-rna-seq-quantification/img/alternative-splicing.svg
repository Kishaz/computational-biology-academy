<svg viewBox="0 0 880 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Alternative splicing. One gene has four coloured exons. Different splicing keeps different exons: isoform one uses all four exons, isoform two skips exon three, isoform three skips exon two. Each isoform makes a different protein, shown as a chain of coloured beads matching its exons.">
<rect x="0.5" y="0.5" width="879" height="429" rx="14" fill="#ffffff" stroke="#dde3ea"/>
<text x="34" y="42" font-size="17" font-weight="800" fill="#28303a">One gene, many proteins: alternative splicing</text>
<text x="34" y="87" font-size="12.5" font-weight="700" fill="#28303a">gene</text>
<text x="34" y="102" font-size="9.5" fill="#5b6675">4 exons</text>
<rect x="180" y="70" width="80" height="24" rx="5" fill="#3f7fd0"/><text x="220" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
<rect x="260" y="79" width="40" height="6" fill="#c3ccd6"/>
<rect x="300" y="70" width="92" height="24" rx="5" fill="#7c5cbf"/><text x="346" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
<rect x="392" y="79" width="40" height="6" fill="#c3ccd6"/>
<rect x="432" y="70" width="72" height="24" rx="5" fill="#1f9c8f"/><text x="468" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
<rect x="504" y="79" width="40" height="6" fill="#c3ccd6"/>
<rect x="544" y="70" width="84" height="24" rx="5" fill="#d9862f"/><text x="586" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
<text x="280" y="66" text-anchor="middle" font-size="9" fill="#5b6675">intron</text>
<line x1="34" y1="120" x2="846" y2="120" stroke="#eef1f4"/>
<text x="34" y="166" font-size="12" font-weight="700" fill="#28303a">isoform 1</text>
<text x="34" y="181" font-size="9.5" fill="#5b6675">all four exons kept</text>
<rect x="180" y="150" width="80" height="22" rx="5" fill="#3f7fd0"/><text x="220" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
<rect x="260" y="150" width="92" height="22" rx="5" fill="#7c5cbf"/><text x="306" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
<rect x="352" y="150" width="72" height="22" rx="5" fill="#1f9c8f"/><text x="388" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
<rect x="424" y="150" width="84" height="22" rx="5" fill="#d9862f"/><text x="466" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
<line x1="518" y1="161" x2="578" y2="161" stroke="#9aa6b3" stroke-width="2"/>
<path d="M 586 161 l -8 -5 l 0 10 z" fill="#9aa6b3"/>
<circle cx="600" cy="161" r="9" fill="#3f7fd0"/>
<line x1="609" y1="161" x2="613" y2="161" stroke="#9aa6b3" stroke-width="3"/>
<circle cx="622" cy="161" r="9" fill="#7c5cbf"/>
<line x1="631" y1="161" x2="635" y2="161" stroke="#9aa6b3" stroke-width="3"/>
<circle cx="644" cy="161" r="9" fill="#1f9c8f"/>
<line x1="653" y1="161" x2="657" y2="161" stroke="#9aa6b3" stroke-width="3"/>
<circle cx="666" cy="161" r="9" fill="#d9862f"/>
<text x="692" y="165" font-size="11" font-weight="700" fill="#5b6675">protein</text>
<text x="34" y="246" font-size="12" font-weight="700" fill="#28303a">isoform 2</text>
<text x="34" y="261" font-size="9.5" fill="#5b6675">exon 3 skipped</text>
<rect x="180" y="230" width="80" height="22" rx="5" fill="#3f7fd0"/><text x="220" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
<rect x="260" y="230" width="92" height="22" rx="5" fill="#7c5cbf"/><text x="306" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
<rect x="352" y="230" width="84" height="22" rx="5" fill="#d9862f"/><text x="394" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
<line x1="446" y1="241" x2="578" y2="241" stroke="#9aa6b3" stroke-width="2"/>
<path d="M 586 241 l -8 -5 l 0 10 z" fill="#9aa6b3"/>
<circle cx="600" cy="241" r="9" fill="#3f7fd0"/>
<line x1="609" y1="241" x2="613" y2="241" stroke="#9aa6b3" stroke-width="3"/>
<circle cx="622" cy="241" r="9" fill="#7c5cbf"/>
<line x1="631" y1="241" x2="635" y2="241" stroke="#9aa6b3" stroke-width="3"/>
<circle cx="644" cy="241" r="9" fill="#d9862f"/>
<text x="670" y="245" font-size="11" font-weight="700" fill="#5b6675">protein</text>
<text x="34" y="326" font-size="12" font-weight="700" fill="#28303a">isoform 3</text>
<text x="34" y="341" font-size="9.5" fill="#5b6675">exon 2 skipped</text>
<rect x="180" y="310" width="80" height="22" rx="5" fill="#3f7fd0"/><text x="220" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
<rect x="260" y="310" width="72" height="22" rx="5" fill="#1f9c8f"/><text x="296" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
<rect x="332" y="310" width="84" height="22" rx="5" fill="#d9862f"/><text x="374" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
<line x1="426" y1="321" x2="578" y2="321" stroke="#9aa6b3" stroke-width="2"/>
<path d="M 586 321 l -8 -5 l 0 10 z" fill="#9aa6b3"/>
<circle cx="600" cy="321" r="9" fill="#3f7fd0"/>
<line x1="609" y1="321" x2="613" y2="321" stroke="#9aa6b3" stroke-width="3"/>
<circle cx="622" cy="321" r="9" fill="#1f9c8f"/>
<line x1="631" y1="321" x2="635" y2="321" stroke="#9aa6b3" stroke-width="3"/>
<circle cx="644" cy="321" r="9" fill="#d9862f"/>
<text x="670" y="325" font-size="11" font-weight="700" fill="#5b6675">protein</text>
<text x="34" y="410" font-size="11.5" fill="#5b6675">Same gene, same DNA. Keep different exons and you build different proteins. This is how ~20,000 genes make far more proteins.</text>
</svg>
