<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Why raw counts mislead. The same gene reads 150 in a deeply sequenced sample and 80 in a shallow one, so raw counts make it look higher in the first. After dividing each by its sequencing depth (size factor), both become 100: the gene did not change, the depth did.">
<rect x="0.5" y="0.5" width="819" height="379" rx="14" fill="#ffffff" stroke="#dde3ea"/>
<text x="34" y="42" font-size="17" font-weight="800" fill="#28303a">Why raw counts mislead: normalise for depth</text>
<text x="34" y="63" font-size="12.5" fill="#5b6675">The same gene, measured in two samples sequenced to different depths.</text>
<text x="150" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#28303a">raw counts</text>
<rect x="80" y="130" width="70" height="120" rx="4" fill="#3f7fd0"/>
<text x="115" y="122" text-anchor="middle" font-size="15" font-weight="800" fill="#28303a">150</text>
<text x="115" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#3f7fd0">sample A</text>
<rect x="180" y="186" width="70" height="64" rx="4" fill="#d9862f"/>
<text x="215" y="178" text-anchor="middle" font-size="15" font-weight="800" fill="#28303a">80</text>
<text x="215" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#d9862f">sample B</text>
<text x="150" y="292" text-anchor="middle" font-size="10.5" fill="#5b6675">A sequenced deeper (1.5x)</text>
<text x="150" y="306" text-anchor="middle" font-size="10.5" fill="#5b6675">B shallower (0.8x)</text>
<text x="150" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b">looks like A &gt; B</text>
<line x1="330" y1="200" x2="440" y2="200" stroke="#9aa6b3" stroke-width="2.5"/>
<path d="M440 200 l-10 -6 l0 12 z" fill="#9aa6b3"/>
<text x="385" y="188" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5b6675">divide by</text>
<text x="385" y="216" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5b6675">each depth</text>
<text x="600" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#28303a">normalised counts</text>
<rect x="530" y="170" width="70" height="80" rx="4" fill="#3f7fd0"/>
<text x="565" y="162" text-anchor="middle" font-size="15" font-weight="800" fill="#28303a">100</text>
<text x="565" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#3f7fd0">sample A</text>
<rect x="630" y="170" width="70" height="80" rx="4" fill="#d9862f"/>
<text x="665" y="162" text-anchor="middle" font-size="15" font-weight="800" fill="#28303a">100</text>
<text x="665" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#d9862f">sample B</text>
<text x="600" y="292" text-anchor="middle" font-size="10.5" fill="#5b6675">150 / 1.5 = 100</text>
<text x="600" y="306" text-anchor="middle" font-size="10.5" fill="#5b6675">80 / 0.8 = 100</text>
<text x="600" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2e8b57">identical: no real change</text>
<text x="34" y="364" font-size="11.5" fill="#5b6675">Raw counts mixed the biology with the sequencing depth. DESeq2 estimates each sample&#39;s depth and divides it out first.</text>
</svg>
