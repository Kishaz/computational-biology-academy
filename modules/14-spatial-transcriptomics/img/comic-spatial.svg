<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Three-panel stick-figure comic. Prof. Zola says single-cell found the immune cells but asks whether they are inside the tumour or stuck at the edge. Amina says she dissociated the tissue, so she lost the map. She points at a tissue with concentric rings and says spatial keeps every cell in place, so now she can see where.">
  <rect x="1" y="1" width="998" height="298" rx="10" fill="#ffffff" stroke="#111111"/>
  <line x1="334" y1="16" x2="334" y2="284" stroke="#e2e6ea"/>
  <line x1="667" y1="16" x2="667" y2="284" stroke="#e2e6ea"/>

  <!-- Panel 1: Prof. Zola -->
  <g stroke="#2b3138" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="80" cy="150" r="20" fill="#f3e8fd"/>
    <line x1="80" y1="170" x2="80" y2="222"/><line x1="80" y1="185" x2="54" y2="208"/>
    <line x1="80" y1="185" x2="112" y2="200"/><line x1="80" y1="222" x2="62" y2="256"/>
    <line x1="80" y1="222" x2="98" y2="256"/>
  </g>
  <rect x="104" y="188" width="26" height="18" rx="3" fill="#dfe4ea" stroke="#111111" stroke-width="2"/>
  <text x="80" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#6b1fb0">Prof. Zola</text>
  <g>
    <rect x="150" y="44" width="182" height="74" rx="12" fill="#f7f9fb" stroke="#111111"/>
    <circle cx="146" cy="129" r="4" fill="#111111"/><circle cx="138" cy="141" r="3" fill="#111111"/>
    <text x="164" y="68" font-size="12.5" fill="#2b3138">Single-cell found immune</text>
    <text x="164" y="88" font-size="12.5" fill="#2b3138">cells. Inside the tumour,</text>
    <text x="164" y="108" font-size="12.5" fill="#2b3138">or stuck at the edge?</text>
  </g>

  <!-- Panel 2: Amina -->
  <g stroke="#2b3138" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="415" cy="150" r="20" fill="#e8f0fe"/>
    <line x1="415" y1="170" x2="415" y2="222"/><line x1="415" y1="185" x2="389" y2="205"/>
    <line x1="415" y1="185" x2="441" y2="205"/><line x1="415" y1="222" x2="397" y2="256"/>
    <line x1="415" y1="222" x2="433" y2="256"/>
  </g>
  <text x="415" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#1a56b0">Amina</text>
  <g>
    <rect x="470" y="52" width="186" height="66" rx="12" fill="#eef5ff" stroke="#111111"/>
    <circle cx="466" cy="129" r="4" fill="#111111"/><circle cx="458" cy="141" r="3" fill="#111111"/>
    <text x="484" y="78" font-size="12.5" fill="#2b3138">I dissociated the tissue.</text>
    <text x="484" y="98" font-size="12.5" fill="#2b3138">I lost the map.</text>
  </g>

  <!-- Panel 3: Amina with a tissue map (concentric rings) -->
  <g stroke="#2b3138" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="720" cy="150" r="20" fill="#e8f0fe"/>
    <line x1="720" y1="170" x2="720" y2="222"/><line x1="720" y1="185" x2="694" y2="205"/>
    <line x1="720" y1="185" x2="746" y2="205"/><line x1="720" y1="222" x2="702" y2="256"/>
    <line x1="720" y1="222" x2="738" y2="256"/>
  </g>
  <!-- concentric tissue motif -->
  <g>
    <circle cx="846" cy="150" r="30" fill="#3f7fd0" opacity="0.9"/>
    <circle cx="846" cy="150" r="20" fill="#d9862f"/>
    <circle cx="846" cy="150" r="9" fill="#7c5cbf"/>
  </g>
  <text x="720" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#1a56b0">Amina</text>
  <g>
    <rect x="786" y="40" width="190" height="52" rx="12" fill="#e6f4ea" stroke="#111111"/>
    <circle cx="782" cy="103" r="4" fill="#111111"/><circle cx="774" cy="115" r="3" fill="#111111"/>
    <text x="800" y="64" font-size="12.5" fill="#2b3138">Spatial keeps each cell</text>
    <text x="800" y="84" font-size="12.5" fill="#2b3138">in place. Now I see where.</text>
  </g>
</svg>
