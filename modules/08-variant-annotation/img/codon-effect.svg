<svg viewBox="0 0 820 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Two examples of how a DNA change reaches the protein. Top: the codon GAT changes its middle base to GGT, so the amino acid changes from Asp to Gly. This is a missense change, the real D614G. Bottom: the codon TTC changes its last base to TTT, but both still code for Phe, so the protein is unchanged. This is a synonymous, silent change.">
  <rect x="1" y="1" width="818" height="328" rx="10" fill="#ffffff" stroke="#d5dbe2"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#2b3138">Same kind of DNA change, two very different outcomes</text>

  <!-- ===== MISSENSE: GAT -> GGT, Asp -> Gly (D614G) ===== -->
  <text x="24" y="70" font-size="12.5" font-weight="700" fill="#c0392b">missense: the protein changes</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" text-anchor="middle">
    <text x="70" y="118" fill="#5b6675">G</text>
    <text x="98" y="118" fill="#c0392b">A</text>
    <text x="126" y="118" fill="#5b6675">T</text>
  </g>
  <text x="98" y="140" font-size="10.5" text-anchor="middle" fill="#c0392b">middle base A&#8594;G</text>

  <!-- arrow to changed codon -->
  <line x1="150" y1="110" x2="210" y2="110" stroke="#9aa2ad" stroke-width="2"/>
  <path d="M210 110 l-10 -5 l0 10 z" fill="#9aa2ad"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" text-anchor="middle">
    <text x="240" y="118" fill="#5b6675">G</text>
    <text x="268" y="118" fill="#c0392b">G</text>
    <text x="296" y="118" fill="#5b6675">T</text>
  </g>

  <!-- translate arrow -->
  <text x="360" y="106" font-size="11" fill="#8a94a0">translates to</text>
  <line x1="330" y1="110" x2="420" y2="110" stroke="#9aa2ad" stroke-width="2"/>
  <path d="M420 110 l-10 -5 l0 10 z" fill="#9aa2ad"/>

  <!-- amino acids -->
  <rect x="440" y="92" width="120" height="34" rx="17" fill="#eef1f4" stroke="#c4c9d0"/>
  <text x="500" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#2b3138">Asp (D)</text>
  <line x1="566" y1="109" x2="606" y2="109" stroke="#c0392b" stroke-width="2"/>
  <path d="M606 109 l-10 -5 l0 10 z" fill="#c0392b"/>
  <rect x="612" y="92" width="120" height="34" rx="17" fill="#fbe9e7" stroke="#e0928a"/>
  <text x="672" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#c0392b">Gly (G)</text>
  <text x="586" y="150" font-size="10.5" text-anchor="middle" fill="#c0392b">this is D614G</text>

  <line x1="24" y1="172" x2="796" y2="172" stroke="#eef1f4"/>

  <!-- ===== SYNONYMOUS: TTC -> TTT, Phe -> Phe ===== -->
  <text x="24" y="208" font-size="12.5" font-weight="700" fill="#2e7d46">synonymous: the protein stays the same</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" text-anchor="middle">
    <text x="70" y="256" fill="#5b6675">T</text>
    <text x="98" y="256" fill="#5b6675">T</text>
    <text x="126" y="256" fill="#2e7d46">C</text>
  </g>
  <text x="98" y="278" font-size="10.5" text-anchor="middle" fill="#2e7d46">last base C&#8594;T</text>

  <line x1="150" y1="248" x2="210" y2="248" stroke="#9aa2ad" stroke-width="2"/>
  <path d="M210 248 l-10 -5 l0 10 z" fill="#9aa2ad"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" text-anchor="middle">
    <text x="240" y="256" fill="#5b6675">T</text>
    <text x="268" y="256" fill="#5b6675">T</text>
    <text x="296" y="256" fill="#2e7d46">T</text>
  </g>

  <text x="360" y="244" font-size="11" fill="#8a94a0">translates to</text>
  <line x1="330" y1="248" x2="420" y2="248" stroke="#9aa2ad" stroke-width="2"/>
  <path d="M420 248 l-10 -5 l0 10 z" fill="#9aa2ad"/>

  <rect x="440" y="230" width="120" height="34" rx="17" fill="#eef1f4" stroke="#c4c9d0"/>
  <text x="500" y="253" font-size="14" font-weight="700" text-anchor="middle" fill="#2b3138">Phe (F)</text>
  <line x1="566" y1="247" x2="606" y2="247" stroke="#2e7d46" stroke-width="2"/>
  <path d="M606 247 l-10 -5 l0 10 z" fill="#2e7d46"/>
  <rect x="612" y="230" width="120" height="34" rx="17" fill="#e6f4ea" stroke="#8bd4a6"/>
  <text x="672" y="253" font-size="14" font-weight="700" text-anchor="middle" fill="#2e7d46">Phe (F)</text>
  <text x="672" y="288" font-size="10.5" text-anchor="middle" fill="#2e7d46">same amino acid</text>

  <text x="24" y="316" font-size="11.5" fill="#5b6675">The genetic code has spare spellings. A changed letter only matters if it changes the amino acid it spells.</text>
</svg>
