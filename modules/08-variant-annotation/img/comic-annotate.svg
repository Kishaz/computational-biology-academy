<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Three-panel stick-figure comic. Amina holds a VCF of four variants and asks what they actually do. Prof. Zola says a difference is not the same as a consequence. Amina runs annotation and finds one is silent and one is the famous D614G in the spike protein.">
  <rect x="1" y="1" width="998" height="298" rx="10" fill="#ffffff" stroke="#d5dbe2"/>

  <line x1="334" y1="16" x2="334" y2="284" stroke="#e2e6ea"/>
  <line x1="667" y1="16" x2="667" y2="284" stroke="#e2e6ea"/>

  <!-- Panel 1: Amina with the VCF -->
  <g stroke="#2b3138" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="80" cy="150" r="20" fill="#e8f0fe"/>
    <line x1="80" y1="170" x2="80" y2="222"/>
    <line x1="80" y1="185" x2="54" y2="205"/>
    <line x1="80" y1="185" x2="106" y2="200"/>
    <line x1="80" y1="222" x2="62" y2="256"/>
    <line x1="80" y1="222" x2="98" y2="256"/>
  </g>
  <rect x="98" y="186" width="22" height="26" rx="2" fill="#eef5ff" stroke="#2b3138" stroke-width="2"/>
  <text x="80" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#1a56b0">Amina</text>
  <g>
    <rect x="150" y="46" width="176" height="70" rx="12" fill="#eef5ff" stroke="#9cc0f5"/>
    <path d="M150 100 l-16 14 l24 -4 z" fill="#eef5ff" stroke="#9cc0f5"/>
    <text x="164" y="72" font-size="12.5" fill="#2b3138">Four variants. But</text>
    <text x="164" y="92" font-size="12.5" fill="#2b3138">what do they</text>
    <text x="164" y="112" font-size="12.5" fill="#2b3138">actually do?</text>
  </g>

  <!-- Panel 2: Prof. Zola -->
  <g stroke="#2b3138" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="415" cy="150" r="20" fill="#f3e8fd"/>
    <line x1="415" y1="170" x2="415" y2="222"/>
    <line x1="415" y1="185" x2="389" y2="205"/>
    <line x1="415" y1="185" x2="441" y2="205"/>
    <line x1="415" y1="222" x2="397" y2="256"/>
    <line x1="415" y1="222" x2="433" y2="256"/>
  </g>
  <text x="415" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#6b1fb0">Prof. Zola</text>
  <g>
    <rect x="470" y="46" width="192" height="70" rx="12" fill="#f7f9fb" stroke="#b9c2cc"/>
    <path d="M486 116 l-8 16 l20 -8 z" fill="#f7f9fb" stroke="#b9c2cc"/>
    <text x="484" y="72" font-size="12.5" fill="#2b3138">A difference is not</text>
    <text x="484" y="92" font-size="12.5" fill="#2b3138">the same thing as</text>
    <text x="484" y="112" font-size="12.5" fill="#2b3138">a consequence.</text>
  </g>

  <!-- Panel 3: Amina discovers D614G -->
  <g stroke="#2b3138" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="748" cy="150" r="20" fill="#e8f0fe"/>
    <line x1="748" y1="170" x2="748" y2="222"/>
    <line x1="748" y1="185" x2="722" y2="205"/>
    <line x1="748" y1="185" x2="774" y2="205"/>
    <line x1="748" y1="222" x2="730" y2="256"/>
    <line x1="748" y1="222" x2="766" y2="256"/>
  </g>
  <text x="748" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#1a56b0">Amina</text>
  <g>
    <rect x="800" y="42" width="184" height="72" rx="12" fill="#e6f4ea" stroke="#8bd4a6"/>
    <path d="M840 106 l-6 16 l18 -10 z" fill="#e6f4ea" stroke="#8bd4a6"/>
    <text x="814" y="66" font-size="12.5" fill="#2b3138">One is silent. One</text>
    <text x="814" y="86" font-size="12.5" fill="#2b3138">rewrites the spike</text>
    <text x="814" y="106" font-size="12.5" fill="#2b3138">protein. D614G.</text>
  </g>
</svg>
