<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diagram of the central dogma (DNA to RNA to Protein) with the molecular data types that measure each layer, plus epigenome regulation and a spatial overlay.">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="468" rx="10" fill="#ffffff" stroke="#d5dbe2"/>

  <text x="500" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#2b3138">The central dogma — and the data that measures each layer</text>
  <text x="500" y="48" text-anchor="middle" font-size="13" fill="#6b7480">DNA  →  RNA  →  Protein</text>

  <!-- Epigenome (regulation) box above DNA -->
  <rect x="30" y="66" width="250" height="70" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="44" y="88" font-size="13" font-weight="700" fill="#b06000">Epigenome — regulation</text>
  <text x="44" y="108" font-size="12" fill="#5f6368">How the genome is packaged &amp; read:</text>
  <text x="44" y="126" font-size="12" fill="#5f6368">ChIP-seq · ATAC-seq · Methylation (WGBS)</text>
  <line x1="155" y1="136" x2="155" y2="168" stroke="#f9ab00" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Stage cards -->
  <!-- DNA -->
  <rect x="30" y="170" width="250" height="152" rx="10" fill="#e8f0fe" stroke="#4a86e8"/>
  <text x="44" y="196" font-size="15" font-weight="700" fill="#1a56b0">DNA — Genome</text>
  <text x="44" y="222" font-size="12.5" fill="#3c4043">Measured by:</text>
  <text x="44" y="244" font-size="12.5" fill="#3c4043">• DNA-seq: WGS · WES · targeted</text>
  <text x="44" y="264" font-size="12.5" fill="#3c4043">• Genotyping arrays</text>
  <text x="44" y="292" font-size="12" fill="#6b7480" font-style="italic">→ sequence &amp; variants (VCF)</text>

  <!-- RNA -->
  <rect x="375" y="170" width="250" height="152" rx="10" fill="#e6f4ea" stroke="#34a853"/>
  <text x="389" y="196" font-size="15" font-weight="700" fill="#137333">RNA — Transcriptome</text>
  <text x="389" y="222" font-size="12.5" fill="#3c4043">Measured by:</text>
  <text x="389" y="244" font-size="12.5" fill="#3c4043">• Bulk RNA-seq</text>
  <text x="389" y="264" font-size="12.5" fill="#3c4043">• Single-cell RNA-seq</text>
  <text x="389" y="292" font-size="12" fill="#6b7480" font-style="italic">→ gene expression / counts</text>

  <!-- Protein -->
  <rect x="720" y="170" width="250" height="152" rx="10" fill="#f3e8fd" stroke="#a142f4"/>
  <text x="734" y="196" font-size="15" font-weight="700" fill="#6b1fb0">Protein — Proteome</text>
  <text x="734" y="222" font-size="12.5" fill="#3c4043">Measured by:</text>
  <text x="734" y="244" font-size="12.5" fill="#3c4043">• Mass-spectrometry</text>
  <text x="734" y="264" font-size="12.5" fill="#3c4043">  proteomics</text>
  <text x="734" y="292" font-size="12" fill="#6b7480" font-style="italic">→ protein IDs &amp; abundance</text>

  <!-- transcription / translation arrows -->
  <line x1="284" y1="246" x2="371" y2="246" stroke="#5f6368" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="327" y="238" text-anchor="middle" font-size="11" fill="#5f6368">transcription</text>
  <line x1="629" y1="246" x2="716" y2="246" stroke="#5f6368" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="672" y="238" text-anchor="middle" font-size="11" fill="#5f6368">translation</text>

  <!-- Spatial overlay band -->
  <line x1="500" y1="322" x2="500" y2="360" stroke="#12a4a4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="845" y1="322" x2="845" y2="360" stroke="#12a4a4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="375" y="360" width="595" height="72" rx="8" fill="#e0f7f7" stroke="#12a4a4"/>
  <text x="389" y="384" font-size="13" font-weight="700" fill="#0b7a7a">Spatial overlay — adds "where in the tissue"</text>
  <text x="389" y="404" font-size="12" fill="#5f6368">Spatial transcriptomics: Visium · Xenium · MERFISH · Slide-seq</text>
  <text x="389" y="422" font-size="12" fill="#5f6368">Spatial proteomics: CODEX · imaging mass cytometry (IMC)</text>

  <!-- Metabolome downstream note -->
  <text x="30" y="404" font-size="12" fill="#6b7480">Downstream of proteins:</text>
  <text x="30" y="422" font-size="12" fill="#6b7480" font-weight="600">Metabolome</text>
  <text x="30" y="440" font-size="11" fill="#9aa2ac">(metabolites — MS / NMR)</text>
</svg>
