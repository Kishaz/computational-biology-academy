<svg viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Bar chart comparing file sizes for the same 20,000 aligned reads: SAM is 7.28 megabytes, BAM is 2.38 megabytes, and CRAM is 1.39 megabytes. Each format stores the same information in less space.">
  <rect x="1" y="1" width="818" height="278" rx="10" fill="#ffffff" stroke="#d5dbe2"/>

  <text x="24" y="36" font-size="15" font-weight="700" fill="#2b3138">The same 20,000 aligned reads, three formats</text>

  <!-- SAM -->
  <text x="24" y="82" font-size="13" font-weight="700" fill="#2b3138">SAM</text>
  <text x="24" y="98" font-size="10.5" fill="#8a94a0">plain text</text>
  <rect x="120" y="66" width="640" height="26" rx="4" fill="#e15d5d" opacity="0.85"/>
  <text x="752" y="84" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="end">7.28 MB</text>

  <!-- BAM -->
  <text x="24" y="142" font-size="13" font-weight="700" fill="#2b3138">BAM</text>
  <text x="24" y="158" font-size="10.5" fill="#8a94a0">compressed binary</text>
  <rect x="120" y="126" width="209" height="26" rx="4" fill="#3f8fd6"/>
  <text x="339" y="144" font-size="12.5" font-weight="700" fill="#2b3138">2.38 MB</text>

  <!-- CRAM -->
  <text x="24" y="202" font-size="13" font-weight="700" fill="#2b3138">CRAM</text>
  <text x="24" y="218" font-size="10.5" fill="#8a94a0">reference-based</text>
  <rect x="120" y="186" width="122" height="26" rx="4" fill="#2e9e5b"/>
  <text x="252" y="204" font-size="12.5" font-weight="700" fill="#2b3138">1.39 MB</text>

  <line x1="120" y1="238" x2="120" y2="60" stroke="#d5dbe2" stroke-dasharray="3 3"/>
  <text x="24" y="262" font-size="11.5" fill="#5b6675">Same information every time. BAM is about a third of SAM; CRAM is under a fifth. On a whole human genome that gap is tens of gigabytes.</text>
</svg>
