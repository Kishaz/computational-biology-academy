<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Three-panel stick-figure comic. Amina holds thousands of clean read fragments but does not know where they belong. She lines them up against the reference genome to find where each one fits. In the last panel every read has found its place on the genome.">
  <rect x="1" y="1" width="998" height="298" rx="10" fill="#ffffff" stroke="#d5dbe2"/>

  <!-- panel dividers -->
  <line x1="334" y1="16" x2="334" y2="284" stroke="#e2e6ea"/>
  <line x1="667" y1="16" x2="667" y2="284" stroke="#e2e6ea"/>

  <!-- ===== Panel 1: Amina with a pile of reads ===== -->
  <g stroke="#2b3138" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="80" cy="150" r="20" fill="#e8f0fe"/>
    <line x1="80" y1="170" x2="80" y2="222"/>
    <line x1="80" y1="185" x2="54" y2="208"/>
    <line x1="80" y1="185" x2="112" y2="200"/>
    <line x1="80" y1="222" x2="62" y2="256"/>
    <line x1="80" y1="222" x2="98" y2="256"/>
  </g>
  <!-- scattered little read fragments -->
  <g stroke="#1a56b0" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="150" x2="140" y2="150"/>
    <line x1="126" y1="164" x2="150" y2="164"/>
    <line x1="118" y1="178" x2="136" y2="178"/>
  </g>
  <text x="80" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#1a56b0">Amina</text>
  <g>
    <rect x="150" y="40" width="170" height="74" rx="12" fill="#eef5ff" stroke="#9cc0f5"/>
    <path d="M150 96 l-16 14 l24 -4 z" fill="#eef5ff" stroke="#9cc0f5"/>
    <text x="164" y="66" font-size="12.5" fill="#2b3138">Thousands of clean</text>
    <text x="164" y="86" font-size="12.5" fill="#2b3138">fragments. But where</text>
    <text x="164" y="106" font-size="12.5" fill="#2b3138">does each one belong?</text>
  </g>

  <!-- ===== Panel 2: the idea, match against the genome ===== -->
  <g stroke="#2b3138" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="415" cy="150" r="20" fill="#e8f0fe"/>
    <line x1="415" y1="170" x2="415" y2="222"/>
    <line x1="415" y1="185" x2="389" y2="205"/>
    <line x1="415" y1="185" x2="441" y2="205"/>
    <line x1="415" y1="222" x2="397" y2="256"/>
    <line x1="415" y1="222" x2="433" y2="256"/>
  </g>
  <text x="415" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#1a56b0">Amina</text>
  <g>
    <rect x="470" y="46" width="188" height="70" rx="12" fill="#eef5ff" stroke="#9cc0f5"/>
    <circle cx="466" cy="128" r="4" fill="#9cc0f5"/><circle cx="458" cy="140" r="3" fill="#9cc0f5"/>
    <text x="484" y="72" font-size="12.5" fill="#2b3138">Match each read to the</text>
    <text x="484" y="92" font-size="12.5" fill="#2b3138">genome, like finding</text>
    <text x="484" y="112" font-size="12.5" fill="#2b3138">where a puzzle piece fits.</text>
  </g>

  <!-- ===== Panel 3: every read has a home ===== -->
  <g stroke="#2b3138" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="748" cy="150" r="20" fill="#e8f0fe"/>
    <line x1="748" y1="170" x2="748" y2="222"/>
    <line x1="748" y1="185" x2="722" y2="205"/>
    <line x1="748" y1="185" x2="774" y2="205"/>
    <line x1="748" y1="222" x2="730" y2="256"/>
    <line x1="748" y1="222" x2="766" y2="256"/>
  </g>
  <!-- genome line with reads stacked on it -->
  <g>
    <line x1="792" y1="176" x2="968" y2="176" stroke="#6b7280" stroke-width="3"/>
    <g stroke="#2e9e5b" stroke-width="4" stroke-linecap="round">
      <line x1="800" y1="150" x2="836" y2="150"/>
      <line x1="844" y1="150" x2="880" y2="150"/>
      <line x1="820" y1="138" x2="856" y2="138"/>
      <line x1="892" y1="150" x2="928" y2="150"/>
    </g>
  </g>
  <text x="748" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#1a56b0">Amina</text>
  <g>
    <rect x="800" y="40" width="176" height="52" rx="12" fill="#e6f4ea" stroke="#8bd4a6"/>
    <path d="M840 84 l-6 16 l18 -10 z" fill="#e6f4ea" stroke="#8bd4a6"/>
    <text x="814" y="64" font-size="12.5" fill="#2b3138">Now every read</text>
    <text x="814" y="84" font-size="12.5" fill="#2b3138">has an address.</text>
  </g>
</svg>
